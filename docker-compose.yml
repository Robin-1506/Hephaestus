services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    command: ["serve"]
    restart: unless-stopped
    networks:
      - hephaestus-network
    environment:
      - OLLAMA_MODELS=/root/.ollama/models

  backend:
    build: ./backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    networks:
      - hephaestus-network
    environment:
      - OLLAMA_HOST=ollama:11434

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hephaestus-network


volumes:
  ollama_data:
    driver: local

networks:
  hephaestus-network:
    driver: bridge
